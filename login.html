<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperDoc Pro | Acceso Público</title>
    <style>
        :root { --bg: #070a13; --accent: #6366f1; --glass: rgba(255, 255, 255, 0.03); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: var(--glass); padding: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 24px; }
        input { width: 100%; padding: 14px; margin-bottom: 16px; background: #000; border: 1px solid #1e293b; border-radius: 12px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .links { margin-top: 20px; font-size: 13px; color: #64748b; }
        a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Iniciar Sesión</h1>
        <input type="email" placeholder="Correo electrónico">
        <input type="password" placeholder="Contraseña">
        <button onclick="window.location.href='home.html'">Acceder</button>
        <div class="links">
            <a href="resetpassword.html">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</body>
</html>
