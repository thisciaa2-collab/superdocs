<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SuperDocs — Inicio</title>

    <!-- Configuración del Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon-32x32.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- BARRA LATERAL CON MENÚ DE USUARIO -->
        <aside class="sidebar">
            <div class="logo">⚡ <span>SuperDocs</span></div>
            
            <!-- Componente de Perfil de Usuario -->
            <div class="menu-usuario">
                <div class="usuario-avatar" id="userAvatar">👤</div>
                <div class="usuario-info">
                    <div class="usuario-nombre" id="userNombre">Cargando...</div>
                    <div class="usuario-correo" id="userCorreo">correo@ejemplo.com</div>
                </div>
            </div>

            <!-- Los 5 Botones de Navegación del Menú -->
            <div class="grupo-control">
                <label>Navegación</label>
                <button onclick="window.location.href='createdocument.html'"><span class="icon">➕</span> Crear archivo</button>
                <button onclick="window.location.href='history.html'"><span class="icon">📜</span> Historial de archivos</button>
                <button onclick="window.location.href='addfriend.html'"><span class="icon">👥</span> Añadir amigos</button>
                <button onclick="window.location.href='windowsapp.html'"><span class="icon">🪟</span> Descarga nuestra app</button>
            </div>

            <!-- Gestión de Cuenta -->
            <div class="grupo-control">
                <label>Cuenta</label>
                <button onclick="cerrarSesion()" class="btn-logout">🚪 Cerrar Sesión</button>
            </div>
        </aside>

        <!-- LIENZO CENTRAL: BIENVENIDA -->
        <main class="zona-editor">
            <div class="contenedor-bienvenida">
                <h1>¡Hola de nuevo! 👋</h1>
                <p>Bienvenido a tu panel de control de SuperDocs. Usa el menú de la izquierda para navegar, revisar tus archivos o redactar un nuevo manuscrito protegido por cifrado.</p>
                <button class="btn-accion-principal" onclick="window.location.href='createdocument.html'">➕ Redactar un nuevo archivo</button>
            </div>
        </main>
    </div>

    <!-- Script de control de Home -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJw_sL9YLe2WbUMf6j5MDTEdHhqvy1u7s",
            authDomain: "superdocs2026.firebaseapp.com",
            projectId: "superdocs2026",
            storageBucket: "superdocs2026.firebasestorage.app",
            messagingSenderId: "517642206953",
            appId: "1:517642206953:web:f732ae4dc855feb3aafa78",
            measurementId: "G-KN295LVLHK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const userNombre = document.getElementById("userNombre");
        const userCorreo = document.getElementById("userCorreo");
        const userAvatar = document.getElementById("userAvatar");

        onAuthStateChanged(auth, (usuario) => {
            if (usuario) {
                userCorreo.innerText = usuario.email;
                userNombre.innerText = usuario.displayName ? usuario.displayName : "Usuario de SuperDocs";
                if (usuario.photoURL) {
                    userAvatar.innerHTML = `<img src="${usuario.photoURL}" alt="Avatar">`;
                }
            } else {
                window.location.href = "login.html";
            }
        });

        window.cerrarSesion = function() {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
