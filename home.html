<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --bg:#070a13; --side:#0b0e1a; --accent:#6366f1; --glass:rgba(255,255,255,0.03); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; }
        aside { width: 260px; background: var(--side); padding: 30px; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .nav-btn { padding: 15px; cursor: pointer; color: #94a3b8; border-radius: 8px; transition: 0.3s; }
        .nav-btn:hover { background: var(--glass); color: #fff; }
        main { flex-grow: 1; padding: 40px; display: flex; gap: 20px; }
        .card { background: var(--glass); padding: 20px; border-radius: 16px; border: 1px solid #1e293b; cursor: pointer; }
        .editor { width: 400px; background: var(--side); padding: 20px; border-radius: 16px; display: none; }
        .editor.active { display: flex; flex-direction: column; }
        textarea { flex-grow: 1; background: var(--bg); color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
    <aside>
        <h2>SuperDoc Pro</h2>
        <div class="nav-btn" onclick="vincular()"><i class="fa-solid fa-desktop"></i> Vincular PC</div>
        <div class="nav-btn" onclick="cerrar()" style="margin-top:auto; color:#ef4444;"><i class="fa-solid fa-power-off"></i> Salir</div>
    </aside>
    <main>
        <div id="grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; width:100%"></div>
        <div class="editor" id="panel">
            <h3 id="fname">Archivo</h3>
            <textarea id="fcontent"></textarea>
            <button onclick="guardar()" style="background:var(--accent); color:white; border:none; padding:10px; cursor:pointer;">Guardar</button>
        </div>
    </main>
    <script>
        let file = "";
        function vincular() { window.chrome?.webview.postMessage("VINCULAR_PC_SOLICITUD"); }
        function cerrar() { localStorage.clear(); window.location.href = "https://superdocs.pages.dev/logininapp"; }
        function guardar() { window.chrome?.webview.postMessage("GUARDAR_ANCLA:"+file+"|"+document.getElementById('fcontent').value); document.getElementById('panel').classList.remove('active'); }
        
        window.chrome?.webview.addEventListener('message', e => {
            document.getElementById('grid').innerHTML = '';
            e.data.files.forEach(f => {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerText = f.name;
                div.onclick = () => { file = f.name; document.getElementById('fname').innerText=f.name; document.getElementById('panel').classList.add('active'); };
                document.getElementById('grid').appendChild(div);
            });
        });
    </script>
</body>
</html>
