<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperDoc Pro - Crear Documento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-card: #0f1424;
            --sidebar-bg: #0b0e1a;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: radial-gradient(circle at top right, #14112e, var(--bg-dark)); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navegación */
        aside { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px 20px; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .brand i { font-size: 24px; color: var(--accent-primary); }
        .brand h2 { font-size: 20px; font-weight: 700; }
        
        nav { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-btn { display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--text-muted); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500; text-decoration: none; }
        .nav-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .nav-btn.active { color: var(--text-main); background: var(--accent-primary); box-shadow: 0 4px 20px var(--accent-glow); }

        /* Área de Trabajo */
        main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 24px; }

        .editor-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 160px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .editor-toolbar { background: rgba(0,0,0,0.3); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 15px; align-items: center; }
        .toolbar-btn { background: none; border: none; color: var(--text-main); font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 8px; transition: background 0.2s; }
        .toolbar-btn:hover { background: rgba(255,255,255,0.08); color: #a3e635; }
        
        .editor-title-input { background: transparent; border: none; color: var(--text-main); font-size: 22px; font-weight: 600; padding: 20px; border-bottom: 1px solid var(--border); width: 100%; outline: none; }
        .wysiwyg-textarea { flex-grow: 1; padding: 30px; color: var(--text-main); font-size: 16px; line-height: 1.6; overflow-y: auto; outline: none; background: transparent; }
        
        .btn-share { margin-left: auto; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
        .btn-share:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <aside>
        <div class="brand"><i class="fa-solid fa-feather-pointed"></i><h2>SuperDoc Pro</h2></div>
        <nav>
            <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i>Home</a>
            <a href="createdocument.html" class="nav-btn active"><i class="fa-solid fa-file-pen"></i>Nuevo Documento</a>
            <a href="addfriend.html" class="nav-btn"><i class="fa-solid fa-user-plus"></i>Añadir Amigo</a>
        </nav>
    </aside>

    <main>
        <h1>Editor de Documentos Inteligente</h1>
        <div class="editor-container">
            <div class="editor-toolbar">
                <button class="toolbar-btn" onclick="ejecutarComando('bold')" title="Negrita (Ctrl+B)"><i class="fa-solid fa-bold"></i></button>
                <button class="toolbar-btn" onclick="ejecutarComando('italic')" title="Cursiva (Ctrl+I)"><i class="fa-solid fa-italic"></i></button>
                <div style="width: 1px; height: 20px; background: var(--border);"></div>
                <button class="toolbar-btn" onclick="descargarTXT()"><i class="fa-solid fa-file-lines"></i> Descargar TXT</button>
                <button class="toolbar-btn" onclick="descargarPDF()"><i class="fa-solid fa-file-pdf"></i> Descargar PDF</button>
                <button class="btn-share" onclick="compartirDocumento()"><i class="fa-solid fa-share-nodes"></i> Compartir</button>
            </div>
            <input type="text" id="doc-title" class="editor-title-input" placeholder="Título del documento..." value="Documento Sin Título">
            <div id="editor-wysiwyg" class="wysiwyg-textarea" contenteditable="true"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDJw_sL9YLe2WbUMf6j5MDTEdHhqvy1u7s",
          authDomain: "superdocs2026.firebaseapp.com",
          projectId: "superdocs2026",
          storageBucket: "superdocs2026.firebasestorage.app",
          messagingSenderId: "517642206953",
          appId: "1:517642206953:web:f732ae4dc855feb3aafa78",
          measurementId: "G-KN295LVLHK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let usuarioActual = null;

        onAuthStateChanged(auth, (user) => {
            if (user) { usuarioActual = user; } 
            else { window.location.href = "logininapp"; }
        });

        const editor = document.getElementById("editor-wysiwyg");

        // Captura e inyección de comandos de formato
        window.ejecutarComando = (comando) => {
            document.execCommand(comando, false, null);
            editor.focus();
        };

        // Atajos de teclado CTRL+B y CTRL+I
        editor.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key.toLowerCase() === "b") { e.preventDefault(); window.ejecutarComando("bold"); }
                if (e.key.toLowerCase() === "i") { e.preventDefault(); window.ejecutarComando("italic"); }
            }
        });

        window.descargarTXT = () => {
            const titulo = document.getElementById("doc-title").value;
            const blob = new Blob([editor.innerText], { type: "text/plain;charset=utf-8" });
            const roamingLink = document.createElement("a");
            roamingLink.href = URL.createObjectURL(blob);
            roamingLink.download = `${titulo}.txt`;
            roamingLink.click();
        };

        window.descargarPDF = () => { window.print(); };

        window.compartirDocumento = async () => {
            const titulo = document.getElementById("doc-title").value;
            const destinoEmail = prompt("Correo electrónico del destinatario:");
            if (!destinoEmail || !usuarioActual) return;

            try {
                await addDoc(collection(db, "documents"), {
                    title: titulo,
                    content: editor.innerHTML,
                    ownerEmail: usuarioActual.email,
                    sharedWith: destinoEmail,
                    createdAt: serverTimestamp()
                });

                await addDoc(collection(db, "inbox"), {
                    toEmail: destinoEmail,
                    fromName: usuarioActual.displayName || "Usuario Pro",
                    fromEmail: usuarioActual.email,
                    type: "DOCUMENTO_COMPARTIDO",
                    message: `Te ha compartido el documento: "${titulo}".`,
                    timestamp: serverTimestamp(),
                    read: false
                });

                alert("¡Documento compartido exitosamente!");
            } catch (err) { console.error(err); }
        };
    </script>
</body>
</html>
